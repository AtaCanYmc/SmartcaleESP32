name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    name: Build Firmware (ESP32-C3)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Cache PlatformIO packages and pip
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
            .pio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Compile PlatformIO environment
        run: pio run

      - name: Upload Firmware Binaries
        uses: actions/upload-artifact@v7
        with:
          name: esp32c3-firmware
          path: |
            .pio/build/esp32-c3-devkitm-1/firmware.bin
            .pio/build/esp32-c3-devkitm-1/bootloader.bin
            .pio/build/esp32-c3-devkitm-1/partitions.bin
          if-no-files-found: error

  app:
    name: Build Companion App (Web / Capacitor 8)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit & service tests
        run: npm test

      - name: Lint frontend code
        run: npm run lint

      - name: Build web bundle & typecheck
        run: npm run build

      - name: Verify Capacitor sync
        run: npx cap sync

      - name: Upload Web App Bundle
        uses: actions/upload-artifact@v7
        with:
          name: smartcale-web-dist
          path: app/dist

  documentation:
    name: Validate Documentation & Governance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify Essential Governance Files
        run: |
          for f in README.md LICENSE CONTRIBUTING.md SECURITY.md ROADMAP.md .gitignore .gitattributes .editorconfig .markdownlint.json; do
            if [ ! -f "$f" ]; then
              echo "Missing required governance file: $f" >&2
              exit 1
            fi
          done
          echo "All core governance files verified."

      - name: Validate Internal Markdown Links
        run: |
          python3 -c '
          import re, glob, os, sys

          all_broken = []
          for md in glob.glob("**/*.md", recursive=True):
              if "node_modules" in md or ".pio" in md:
                  continue
              content = open(md, encoding="utf-8").read()
              content = re.sub(r"```[\s\S]*?```", "", content)
              content = re.sub(r"`[^`]*`", "", content)
              links = re.findall(r"\[.*?\]\((?!https?://|mailto:)(.*?)(?:#.*)?\)", content)
              for link in links:
                  link = link.strip()
                  if not link or link.startswith("#"):
                      continue
                  target = os.path.normpath(os.path.join(os.path.dirname(md), link))
                  if not os.path.exists(target):
                      all_broken.append(f"{md} -> {link} (resolved: {target})")

          if all_broken:
              print("Broken markdown links detected:")
              for b in all_broken:
                  print(f"  {b}")
              sys.exit(1)
          print("All internal documentation links are valid.")
          '

  all-checks-passed:
    name: All CI Checks
    needs: [firmware, app, documentation]
    runs-on: ubuntu-latest
    steps:
      - name: Success
        run: echo "All firmware and app CI checks have passed successfully."
