name: Release Please

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please & Firmware Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

      # Build and attach ESP32-C3 firmware assets when a release is cut
      - name: Checkout repository for release build
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@v7

      - name: Set up Python
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Cache PlatformIO packages and pip
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
            .pio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO Core
        if: ${{ steps.release.outputs.release_created }}
        run: pip install --upgrade platformio

      - name: Compile Release Firmware
        if: ${{ steps.release.outputs.release_created }}
        run: pio run

      - name: Upload Firmware Assets to GitHub Release
        if: ${{ steps.release.outputs.release_created }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.release.outputs.tag_name }}" \
            .pio/build/esp32-c3-devkitm-1/firmware.bin \
            .pio/build/esp32-c3-devkitm-1/bootloader.bin \
            .pio/build/esp32-c3-devkitm-1/partitions.bin \
            --clobber
