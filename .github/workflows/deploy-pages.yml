name: Deploy Web Flasher to GitHub Pages

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'src/**'
      - 'include/**'
      - 'platformio.ini'
      - 'web-flasher/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO packages and pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
            .pio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Compile ESP32-C3 Firmware
        run: pio run

      - name: Prepare Web Flasher Bundle
        run: |
          mkdir -p web-flasher/firmware
          cp .pio/build/esp32-c3-devkitm-1/bootloader.bin web-flasher/firmware/
          cp .pio/build/esp32-c3-devkitm-1/partitions.bin web-flasher/firmware/
          cp .pio/build/esp32-c3-devkitm-1/firmware.bin web-flasher/firmware/
          ls -lh web-flasher/firmware/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'web-flasher'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
