<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Smartcale - Smart Kitchen Scale & Nutrition Companion</title>
    <meta name="description" content="Connected kitchen scale companion application. Real-time BLE weighing, nutrition and macro tracking, barcode scanner, and interactive recipes." />
    <meta name="keywords" content="Smartcale, Smart Scale, Kitchen Scale, BLE Scale, Macro Tracker, Calorie Counter, ESP32 Scale, Recipe Mixing, Open Food Facts" />
    <meta name="author" content="Ata Can" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0e213e" />
    <meta name="color-scheme" content="light dark" />

    <script>
      (function() {
        try {
          var saved = localStorage.getItem('smartcale-theme') || localStorage.getItem('smartscale-theme');
          var meta = document.querySelector('meta[name="color-scheme"]');
          var effective = saved === 'light' || saved === 'dark' ? saved : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', effective);
          if (meta) meta.setAttribute('content', (saved === 'light' || saved === 'dark') ? saved : 'light dark');
        } catch (e) {}
      })();
    </script>
