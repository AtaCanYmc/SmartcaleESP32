[env:esp32-c3-devkitm-1]
platform = platformio/espressif32 @ ~6.6.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

upload_command = python3 -m esptool --chip esp32c3 --port $UPLOAD_PORT write-flash 0x0 $BUILD_DIR/bootloader.bin 0x8000 $BUILD_DIR/partitions.bin 0x10000 $BUILD_DIR/firmware.bin

board_build.partitions = huge_app.csv
board_build.flash_mode = dio
board_build.f_flash = 40000000L

build_unflags = -std=gnu++11
build_flags = 
    -std=gnu++17
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

lib_deps = 
    bogde/HX711 @ ^0.7.5
    olikraus/U8g2 @ ^2.35.19
